<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Güneş Sistemi Portfolyo — Demo</title>
  <meta name="description" content="Güneş Sistemi temalı portfolyo demo" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{ --primary:#0ea5a4; --muted:#aeb6cf; }
    *{ box-sizing: border-box }
    body{ margin:0; font-family:Poppins,system-ui,sans-serif; color:#fff; background:radial-gradient(60% 60% at 50% 20%, #0b1020 0%, #050712 60%, #020617 100%) }
    .wrap{ min-height:100vh; display:grid; place-items:center; position:relative; overflow:hidden }
    .stars{ position:absolute; inset:0; background-image: radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.35) 0, transparent 40%),radial-gradient(1.5px 1.5px at 70% 80%, rgba(255,255,255,.25) 0, transparent 40%),radial-gradient(1px 1px at 40% 60%, rgba(255,255,255,.25) 0, transparent 40%); }
    h1{ font-family:Orbitron,system-ui,sans-serif; margin:0; font-size: clamp(32px, 5vw, 56px); }
    .center{ text-align:center; position:relative; z-index:1 }
    .muted{ color:var(--muted) }
    .orbits{ position:relative; width:min(80vw,640px); aspect-ratio:1; margin-top:2rem }
    .ring{ position:absolute; inset:0; border-radius:9999px; border:1px solid rgba(255,255,255,.12); animation: spin var(--dur,12s) linear infinite }
    .ring > .origin{ position:absolute; left:50%; top:50%; transform: translate(-50%,-50%); }
    .planet{ width:44px; height:44px; border-radius:9999px; box-shadow: inset 0 8px 18px rgba(255,255,255,.08), 0 10px 28px rgba(0,0,0,.45); background: radial-gradient(60% 60% at 30% 30%, rgba(255,255,255,.25) 0%, #7c5cff 100%); transform: translateX(var(--r,7rem)); will-change: transform; }
    .planet:focus-visible{ outline:2px dashed var(--primary); outline-offset:3px }
    .tooltip{ position:absolute; left:50%; transform:translateX(-50%); top:-1.75rem; background: rgba(0,0,0,.7); padding:.25rem .5rem; border-radius:.375rem; font-size:12px }
    @keyframes spin { from{ transform: rotate(0) } to{ transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce){ .ring{ animation:none } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stars" aria-hidden="true"></div>
    <section class="center">
      <h1>Mikail Güven</h1>
      <p class="muted">Full Stack Developer & Cyber Security Enthusiast</p>
      <div class="orbits" aria-hidden="true">
        <div class="ring" style="--dur:6s">
          <div class="origin"><button class="planet" style="--r:7rem" aria-describedby="t1"><span class="sr-only">HTML</span></button><div id="t1" role="tooltip" class="tooltip">HTML</div></div>
        </div>
        <div class="ring" style="--dur:12s">
          <div class="origin"><button class="planet" style="--r:11rem" aria-describedby="t2"><span class="sr-only">CSS</span></button><div id="t2" role="tooltip" class="tooltip">CSS</div></div>
        </div>
        <div class="ring" style="--dur:20s">
          <div class="origin"><button class="planet" style="--r:15rem" aria-describedby="t3"><span class="sr-only">JS</span></button><div id="t3" role="tooltip" class="tooltip">JavaScript</div></div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
